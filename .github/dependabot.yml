version: 2

updates:
  # Go module dependencies. client-go moves fast and capsize pins it to a
  # single minor, so weekly is frequent enough to notice a security release
  # without a pull request every day.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"

  # The workflows pin actions by commit SHA, which is what makes a rerun of an
  # old commit reproducible - and what stops those pins ever updating on their
  # own. Dependabot is therefore the only thing that moves them: it rewrites
  # the SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
