name: Release

# Tag-driven. Push a v* tag and the four binaries appear on the release.
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # goreleaser creates the GitHub Release and uploads assets

jobs:
  goreleaser:
    name: build · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and changelog from tag history, so
          # the default shallow clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # tracks go.mod; cannot drift from it
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
