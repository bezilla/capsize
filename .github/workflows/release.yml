name: Release

# Tag-driven. Push a v* tag and the four binaries appear on the release.
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Actions are pinned by commit SHA: this workflow is the one that signs its
# name to an artifact other people download, so "which code ran" has to have a
# single answer.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: build · publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # goreleaser creates the GitHub Release and uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version and changelog from tag history, so
          # the default shallow clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # tracks go.mod; cannot drift from it
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
