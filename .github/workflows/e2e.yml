name: E2E

# The fixture cluster as an automated gate.
#
# Deliberately a separate workflow from CI: spinning kind takes minutes and
# can flake on a runner, and neither should stand between a push and the fast
# unit path. If this is red and CI is green, the regression is in behavior
# against a real API server, which is exactly the class of bug that a green
# unit suite missed once already.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: fixture oracle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build capsize
        run: go build -o capsize .

      - name: create the fixture cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/fixture/kind-cluster.yaml
          cluster_name: capsize
          wait: 120s

      - name: show node capacity
        run: |
          kubectl get nodes -o custom-columns=\
          'NAME:.metadata.name,POOL:.metadata.labels.capsize\.test/pool,ALLOC:.status.allocatable.memory'

      - name: install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          # kind's kubelet serving certificates are self-signed.
          kubectl patch deploy metrics-server -n kube-system --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          # Pin it to the control plane. The fixture workloads are all pinned by
          # nodeSelector, so metrics-server is the only pod free to land on a
          # worker - and where it lands changes that node's neighbor count and
          # therefore the risk scores this job asserts on.
          kubectl patch deploy metrics-server -n kube-system --type=strategic -p '{
            "spec": {"template": {"spec": {
              "nodeSelector": {"node-role.kubernetes.io/control-plane": ""},
              "tolerations": [{"key": "node-role.kubernetes.io/control-plane", "effect": "NoSchedule"}]
            }}}
          }'
          kubectl wait --for=condition=Available deploy/metrics-server -n kube-system --timeout=180s

      - name: apply the fixture workloads
        run: |
          kubectl apply -f test/e2e/fixture/00-namespaces.yaml
          for f in test/e2e/fixture/1*.yaml test/e2e/fixture/2*.yaml; do
            kubectl apply -f "$f"
          done
          for ns in prod sandbox batch; do
            kubectl wait --for=condition=Available deploy --all -n "$ns" --timeout=300s
          done

      - name: wait for the fixture to reach steady state
        run: |
          # The fixture's design is "allocate a fixed ballast, then sleep", and
          # it has not reached that state until two things are true: memory is
          # up, and CPU has fallen back to idle.
          #
          # Both matter. Scanning mid-allocation sees a workload as
          # over-provisioned on memory that is not. Scanning while the dd is
          # still burning CPU makes CAP109 fire on prod/good-api, which
          # requests 100m and uses none once settled - and prod/good-api is
          # the false-positive control, so that turns the most important
          # assertion in this job into a coin flip.
          #
          # Requires two consecutive clean polls so a single quiet scrape
          # during the allocation does not read as settled.
          stable=0
          for i in $(seq 1 60); do
            top=$(kubectl top pods -A --no-headers 2>/dev/null || true)
            mem=$(echo "$top" | awk '$1=="sandbox" && $2 ~ /^limits-only-/ {gsub(/Mi/,"",$4); print $4+0}')
            zero_mem=$(echo "$top" | awk '$1 ~ /^(prod|sandbox|batch)$/ && $4 == "0Mi"' | wc -l)
            busy_cpu=$(echo "$top" | awk '$1 ~ /^(prod|sandbox|batch)$/ && $3 != "0m"' | wc -l)
            echo "attempt $i: limits-only=${mem:-none}Mi  pods at 0Mi=$zero_mem  pods burning cpu=$busy_cpu  clean polls=$stable"
            if [ -n "$mem" ] && [ "$mem" -ge 700 ] && [ "$zero_mem" -eq 0 ] && [ "$busy_cpu" -eq 0 ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then break; fi
            else
              stable=0
            fi
            sleep 10
          done
          kubectl top pods -A
          if [ "$stable" -lt 2 ]; then
            echo "fixture never reached steady state: $stable consecutive clean polls, wanted 2"
            exit 1
          fi
          echo "steady state reached after $i polls"

      - name: scan
        run: ./capsize -A --json > report.json

      - name: assert the oracle
        run: python3 test/e2e/assert_oracle.py report.json

      - name: human-readable report
        if: always()
        run: ./capsize -A --no-color || true

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capsize-report
          path: report.json
          if-no-files-found: warn
