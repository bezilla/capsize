name: CI

# Actions are pinned by commit SHA rather than by tag. A tag is mutable: the
# same workflow file can run different code tomorrow, which is the thing a
# green build is supposed to rule out. Dependabot updates the SHAs and keeps
# the trailing version comment accurate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # tracks go.mod; cannot drift from it
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1   # pinned so a lint release cannot redden a green branch

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities on a call path capsize actually reaches,
      # so a CVE in an unused corner of client-go does not stop the world.
      #
      # Pinned, for the same reason the actions are: @latest means a scanner
      # release can turn a green branch red without a commit, and nobody can
      # reproduce yesterday's result. Dependabot proposes the bump.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  docs:
    name: docs match the capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README's terminal block, docs/scan.txt and every figure quoted in
      # prose all come from one capsize run, because absolute scores move with
      # node size and a page mixing two hosts contradicts itself. This is the
      # check half of docs/capture.sh; it reads committed files only, so it
      # needs neither a cluster nor freeze.
      - name: docs/capture.sh --check
        run: ./docs/capture.sh --check

  readonly:
    name: read-only guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Its own job so the Actions UI shows, by name, that the read-only
      # guarantee is enforced on every push rather than asserted in a README.
      - name: AST walk for write-shaped calls and unauthorised imports
        run: go test -v ./internal/guard/...
