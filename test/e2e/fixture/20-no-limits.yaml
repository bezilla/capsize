# THE CLASSIC SHAPE. Requests set, NO LIMITS. Uses 160Mi of its 256Mi request
# (1.6x) deliberately — below the divergence threshold, so this workload
# demonstrates ONE thing: a missing limit. Nothing else should fire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-worker
  namespace: sandbox
  labels: { capsize.test/expect: "missing-limits" }
spec:
  replicas: 1
  selector: { matchLabels: { app: legacy-worker } }
  template:
    metadata:
      labels: { app: legacy-worker }
    spec:
      nodeSelector: { capsize.test/pool: ondemand-small }
      volumes:
        - name: ballast
          emptyDir: { medium: Memory, sizeLimit: 176Mi }
      containers:
        - name: app
          image: busybox:1.36
          # allocate 160Mi of real, resident memory so metrics-server
          # reports believable usage. tmpfs pages count against the container cgroup.
          command: ["sh","-c","dd if=/dev/zero of=/ballast/f bs=1M count=160 2>/dev/null; sleep infinity"]
          volumeMounts:
            - { name: ballast, mountPath: /ballast }
          resources:
            requests: { memory: 256Mi, cpu: "200m" }
            # limits: intentionally absent
